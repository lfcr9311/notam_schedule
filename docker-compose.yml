# Identificador de NOTAM (página em /notam/ pelo Caddy do fortran) e API de NOTAMs de pista.
# Mesma rede do Caddy que o notam-tw, que chama http://notam-schedule:8000 por dentro da rede.
# A porta no host fica só no localhost do servidor (diagnóstico com curl).
services:
  notam-schedule:
    build: .
    container_name: notam-schedule
    restart: unless-stopped
    env_file: .env                  # AISWEB_API_KEY, AISWEB_API_PASS, NOTAM_API_KEY (não vão pro git)
    environment:
      NOTAM_ROOT_PATH: /notam       # o Caddy do fortran publica a página em /notam/ (tira o prefixo)
      # links dos e-mails do resumo de NOTAMs (09:00 e 16:00 de Brasília, lista em data/reference/alert_airports.txt)
      NOTAM_PUBLIC_URL: http://ec2-3-137-219-87.us-east-2.compute.amazonaws.com/notam/
    volumes:
      - ./data:/app/data            # cache, histórico bruto da AISWEB e execuções sobrevivem ao redeploy
    ports:
      - "127.0.0.1:8002:8000"       # no host: 8000 = notam-tw, 8001 = mega_map
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-fortran_default}
