# Deploy automático: a cada push na master, roda os testes (sem rede: AISWEB mockada/offline),
# entra no EC2 por SSH e roda deploy/atualizar.sh (git reset + docker compose up --build).
# A API fica só na rede interna do Docker (o notam-tw chama http://notam-schedule:8000).
name: Deploy no EC2

on:
  push:
    branches: [master]
  workflow_dispatch:          # botão "Run workflow" na aba Actions

# um deploy por vez; um push durante o deploy espera o anterior terminar
concurrency:
  group: deploy-ec2-notam-schedule
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Testes
        run: |
          pip install -e ".[dev]"
          python -m pytest -q
      - name: Build da imagem
        run: docker build -t notam-schedule:ci .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Atualizar o servidor
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          for v in EC2_HOST EC2_USER EC2_SSH_KEY EC2_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::Falta o secret $v (Settings > Secrets and variables > Actions)"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          EC2_HOST=$(printf '%s' "$EC2_HOST" | tr -d '[:space:]')
          EC2_USER=$(printf '%s' "$EC2_USER" | tr -d '[:space:]')
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 -o ConnectTimeout=20 \
              "$EC2_USER@$EC2_HOST" \
              "DEPLOY_BRANCH='${{ github.ref_name }}' bash ~/notam_schedule/deploy/atualizar.sh"
